<!DOCTYPE html>
<html lang="es" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiPrep AI | Plataforma Educativa Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                            950: '#042f2e',
                        },
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .content-text { font-family: 'Inter', sans-serif; line-height: 1.8; color: #cbd5e1; }
        .content-text p { margin-bottom: 1.5rem; text-align: justify; }
        .content-text h3 { color: #f8fafc; font-size: 1.5rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="sticky top-0 z-50 backdrop-blur-xl bg-dark-900/80 border-b border-dark-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('landing')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-teal-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-graduation-cap text-white text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">CertiPrep AI</span>
            </div>
            <div id="nav-actions" class="flex items-center space-x-4">
                <!-- Inyectado dinámicamente -->
            </div>
        </div>
    </header>

    <main id="app-container" class="flex-grow flex flex-col"></main>

    <script>
        // ==========================================
        // MOTOR GENERADOR DE CONTENIDO MASIVO
        // ==========================================
        function generateModuleContent(baseText, isPremium) {
            const repetitions = isPremium ? 15 : 6; 
            let finalHtml = '';
            
            for(let i = 0; i < repetitions; i++) {
                finalHtml += `
                    <div class="flex flex-col lg:flex-row gap-8 mb-8 items-start">
                        <div class="flex-1 content-text">
                            ${baseText}
                        </div>
                        ${i % 2 === 0 ? `
                        <div class="w-full lg:w-1/3 flex-shrink-0">
                            <img src="https://placehold.co/600x400/1e293b/14b8a6?text=Ilustración+Educativa+${i+1}" 
                                 alt="Concepto Educativo" 
                                 class="w-full h-auto rounded-xl shadow-lg border border-dark-700 object-cover hover:scale-105 transition-transform duration-300">
                            <p class="text-xs text-center text-slate-500 mt-2 italic">Figura ${i+1}: Representación gráfica del concepto tratado.</p>
                        </div>
                        ` : ''}
                    </div>
                `;
            }
            
            finalHtml += `
                <div class="mt-12 bg-dark-800 border-l-4 border-brand-500 p-6 rounded-r-xl shadow-lg">
                    <h4 class="text-brand-400 font-bold text-lg mb-2"><i class="fa-solid fa-lightbulb mr-2"></i> Pregunta de Reflexión</h4>
                    <p class="text-slate-300 italic mb-4">Con base en los conceptos que acabas de leer, ¿Cómo aplicarías esta teoría en un escenario corporativo real para optimizar costos y tiempos?</p>
                    <textarea class="w-full bg-dark-900 border border-dark-700 rounded-lg p-3 text-sm text-slate-200 focus:border-brand-500 focus:outline-none" rows="4" placeholder="Escribe tus reflexiones aquí..."></textarea>
                </div>
            `;
            return finalHtml;
        }

        const baseTechText = `
            <p>La computación en la nube y el desarrollo tecnológico han revolucionado la manera en que las organizaciones gestionan sus recursos digitales. En lugar de mantener centros de datos locales costosos y difíciles de escalar, las empresas ahora confían en proveedores de nube para obtener capacidad de cómputo, almacenamiento y bases de datos bajo demanda.</p>
            <p>Esta transformación no es solo técnica, sino también financiera y operativa. Los modelos de precios de pago por uso permiten a las startups competir con corporaciones multinacionales, democratizando el acceso a tecnologías de punta como el aprendizaje automático y el análisis de big data.</p>
            <p>La seguridad es un componente crítico en este ecosistema. El modelo de responsabilidad compartida dicta que el proveedor protege la infraestructura subyacente, mientras que el cliente debe asegurar los datos, las configuraciones de red y la gestión de identidades.</p>
            <p>Además, la alta disponibilidad y la tolerancia a fallos se diseñan asumiendo que los componentes individuales eventualmente fallarán. Al distribuir recursos a través de múltiples zonas de disponibilidad y regiones geográficas, los sistemas modernos pueden soportar fallos imprevistos.</p>
        `;

        const baseMedText = `
            <p>El estudio de la anatomía y fisiología humana es el pilar fundamental de las ciencias de la salud. Comprender cómo interactúan los diferentes sistemas del cuerpo (cardiovascular, respiratorio, nervioso y endocrino) permite a los profesionales médicos diagnosticar y tratar enfermedades con precisión.</p>
            <p>La homeostasis, el estado de equilibrio interno, es mantenido por mecanismos de retroalimentación complejos. Cuando estos mecanismos fallan, se presenta la patología. El análisis clínico detallado, junto con la interpretación de pruebas de laboratorio e imágenes diagnósticas, es crucial para identificar el origen.</p>
            <p>La farmacología moderna ofrece herramientas terapéuticas específicas, pero requiere un profundo conocimiento de la farmacocinética y la farmacodinámica para evitar interacciones adversas y toxicidad.</p>
            <p>En el contexto de la salud pública, la epidemiología y las medidas preventive juegan un rol vital en la reducción de la morbilidad a nivel poblacional, requiriendo protocolos rigurosos de bioseguridad.</p>
        `;

        function generateQuestions(baseQs, category, isPremium) {
            const total = isPremium ? 25 : 10; 
            const qs = [...baseQs];
            for (let i = qs.length; i < total; i++) {
                qs.push({
                    q: `Pregunta avanzada #${i+1} de ${category}: Seleccione el enunciado o concepto que describa correctamente los estándares de esta materia.`,
                    options: [
                        "Opción A (Respuesta Correcta)", 
                        "Opción B (Distractor común)", 
                        "Opción C (Premisa incompleta)", 
                        "Opción D (Concepto erróneo)"
                    ],
                    answer: 0,
                    hint: `Analiza la premisa principal en el contexto de ${category}. La IA detecta un patrón conceptual que debes revisar.`
                });
            }
            return qs;
        }

        const coursesDB = [
            // TECNOLOGÍA
            { id: 'c1', cat: 'Tecnología', title: 'Fundamentos de Cloud Computing', isFree: true, icon: 'fa-cloud', modules: Array.from({length: 5}, (_, i) => ({ title: `Módulo ${i+1}: Conceptos Básicos`, content: generateModuleContent(baseTechText, false) })) },
            { id: 'c2', cat: 'Tecnología', title: 'Arquitectura AWS Avanzada', isFree: false, icon: 'fa-server', modules: Array.from({length: 12}, (_, i) => ({ title: `Módulo ${i+1}: Diseño Resiliente`, content: generateModuleContent(baseTechText, true) })) },
            // MEDICINA
            { id: 'c3', cat: 'Medicina', title: 'Anatomía Humana Básica', isFree: true, icon: 'fa-heart-pulse', modules: Array.from({length: 5}, (_, i) => ({ title: `Módulo ${i+1}: Sistemas del Cuerpo`, content: generateModuleContent(baseMedText, false) })) },
            { id: 'c4', cat: 'Medicina', title: 'Farmacología Clínica Avanzada', isFree: false, icon: 'fa-pills', modules: Array.from({length: 15}, (_, i) => ({ title: `Módulo ${i+1}: Farmacodinamia`, content: generateModuleContent(baseMedText, true) })) },
            // NEGOCIOS
            { id: 'c5', cat: 'Negocios', title: 'Gestión Ágil de Proyectos', isFree: true, icon: 'fa-chart-pie', modules: Array.from({length: 5}, (_, i) => ({ title: `Módulo ${i+1}: Scrum Framework`, content: generateModuleContent(baseTechText, false) })) },
            { id: 'c6', cat: 'Negocios', title: 'MBA Acelerado: Finanzas Corporativas', isFree: false, icon: 'fa-money-bill-trend-up', modules: Array.from({length: 10}, (_, i) => ({ title: `Módulo ${i+1}: Valoración de Empresas`, content: generateModuleContent(baseTechText, true) })) },
            // DERECHO
            { id: 'c7', cat: 'Derecho', title: 'Introducción al Derecho Penal', isFree: true, icon: 'fa-scale-balanced', modules: Array.from({length: 5}, (_, i) => ({ title: `Módulo ${i+1}: Teoría del Delito`, content: generateModuleContent(baseTechText, false) })) },
            { id: 'c8', cat: 'Derecho', title: 'Derecho Internacional Privado', isFree: false, icon: 'fa-globe', modules: Array.from({length: 10}, (_, i) => ({ title: `Módulo ${i+1}: Jurisdicción`, content: generateModuleContent(baseTechText, true) })) },
            // IDIOMAS
            { id: 'c9', cat: 'Idiomas', title: 'Inglés Básico B1', isFree: true, icon: 'fa-language', modules: Array.from({length: 5}, (_, i) => ({ title: `Módulo ${i+1}: Estructura Gramatical`, content: generateModuleContent(baseTechText, false) })) },
            { id: 'c10', cat: 'Idiomas', title: 'Preparación TOEFL iBT Pro', isFree: false, icon: 'fa-spell-check', modules: Array.from({length: 12}, (_, i) => ({ title: `Módulo ${i+1}: Speaking & Writing`, content: generateModuleContent(baseTechText, true) })) },
            // INGENIERÍA
            { id: 'c11', cat: 'Ingeniería', title: 'Física Clásica: Mecánica', isFree: true, icon: 'fa-gear', modules: Array.from({length: 5}, (_, i) => ({ title: `Módulo ${i+1}: Leyes de Newton`, content: generateModuleContent(baseTechText, false) })) },
            { id: 'c12', cat: 'Ingeniería', title: 'Diseño Estructural Avanzado', isFree: false, icon: 'fa-building', modules: Array.from({length: 15}, (_, i) => ({ title: `Módulo ${i+1}: Resistencia de Materiales`, content: generateModuleContent(baseTechText, true) })) }
        ];

        const simulatorsDB = [
            // TECNOLOGÍA
            { id: 's1', cat: 'Tecnología', title: 'Test Básico: AWS Cloud', isFree: true, questions: generateQuestions([
                { q: "¿Cuál es una ventaja clave de la nube?", options: ["Pago por uso", "Compras de hardware", "Mantenimiento local"], answer: 0, hint: "Recuerda que no pagas por adelantado." },
                { q: "¿Qué servicio provee DNS en AWS?", options: ["Route 53", "S3", "EC2"], answer: 0, hint: "Es el servicio que gestiona rutas y dominios." }
            ], 'Tecnología', false)},
            { id: 's2', cat: 'Tecnología', title: 'Simulacro Pro AWS Architect', isFree: false, questions: generateQuestions([
                { q: "¿Qué clase de S3 es más barata para archivo a largo plazo?", options: ["S3 Standard", "S3 Glacier Deep Archive", "S3 One Zone"], answer: 1, hint: "Deep Archive es para retención de años." },
                { q: "¿Cómo proteger instancias EC2 de ataques web?", options: ["WAF", "Security Groups", "Ambas"], answer: 2, hint: "La seguridad se implementa en capas." }
            ], 'Tecnología', true)},
            // MEDICINA
            { id: 's3', cat: 'Medicina', title: 'Test Básico: Anatomía', isFree: true, questions: generateQuestions([
                { q: "¿Cuál es el hueso más largo del cuerpo humano?", options: ["Fémur", "Tibia", "Húmero"], answer: 0, hint: "Se encuentra en la pierna superior." },
                { q: "¿Qué órgano produce la insulina?", options: ["Hígado", "Páncreas", "Riñón"], answer: 1, hint: "Es una glándula detrás del estómago." }
            ], 'Medicina', false)},
            { id: 's4', cat: 'Medicina', title: 'Simulacro ENARM / MIR Pro', isFree: false, questions: generateQuestions([
                { q: "Tratamiento de primera línea para IAM con elevación del ST:", options: ["Angioplastia primaria", "Observación", "Paracetamol"], answer: 0, hint: "Hay que reperfundir rápidamente." },
                { q: "Causa más común de hipotiroidismo:", options: ["Enfermedad de Hashimoto", "Déficit de Yodo", "Cirugía"], answer: 0, hint: "Es una enfermedad autoinmune." }
            ], 'Medicina', true)},
            // NEGOCIOS
            { id: 's5', cat: 'Negocios', title: 'Test Básico: Gestión Ágil', isFree: true, questions: generateQuestions([
                { q: "¿Cuánto dura típicamente un Sprint en Scrum?", options: ["1 a 4 semanas", "6 meses", "1 día"], answer: 0, hint: "Es un ciclo iterativo corto." },
                { q: "¿Quién prioriza el Product Backlog?", options: ["Scrum Master", "Product Owner", "Developer"], answer: 1, hint: "Es el dueño del producto." }
            ], 'Negocios', false)},
            { id: 's6', cat: 'Negocios', title: 'Simulacro PMP Pro', isFree: false, questions: generateQuestions([
                { q: "¿Qué proceso pertenece al grupo de Monitoreo y Control?", options: ["Dirigir el trabajo", "Validar el alcance", "Desarrollar el Acta"], answer: 1, hint: "Asegura que los entregables cumplan requisitos." },
                { q: "La técnica de estimación PERT usa:", options: ["1 valor", "2 valores", "3 valores (Optimista, Pesimista, Probable)"], answer: 2, hint: "Calcula un promedio ponderado." }
            ], 'Negocios', true)},
            // DERECHO
            { id: 's7', cat: 'Derecho', title: 'Test Básico: Conceptos Penales', isFree: true, questions: generateQuestions([
                { q: "¿Qué es el Habeas Corpus?", options: ["Protección contra detención ilegal", "Un impuesto", "Un contrato"], answer: 0, hint: "Protege la libertad individual." },
                { q: "¿Qué principio rige la ley penal en el tiempo?", options: ["Irretroactividad", "Culpa", "Dolo"], answer: 0, hint: "La ley no aplica al pasado salvo favorabilidad." }
            ], 'Derecho', false)},
            { id: 's8', cat: 'Derecho', title: 'Simulacro Bar Exam Pro', isFree: false, questions: generateQuestions([
                { q: "¿Qué elemento no es esencial en un contrato?", options: ["Consentimiento", "Objeto", "Notarización"], answer: 2, hint: "Muchos contratos son verbales y válidos." },
                { q: "El control de convencionalidad es ejercido por:", options: ["Jueces nacionales", "Corte IDH", "Ambos"], answer: 2, hint: "Tanto tribunales internos como internacionales." }
            ], 'Derecho', true)},
            // IDIOMAS
            { id: 's9', cat: 'Idiomas', title: 'Placement Test Básico', isFree: true, questions: generateQuestions([], 'Idiomas', false) },
            { id: 's10', cat: 'Idiomas', title: 'Simulacro TOEFL Pro', isFree: false, questions: generateQuestions([], 'Idiomas', true) },
            // INGENIERÍA
            { id: 's11', cat: 'Ingeniería', title: 'Test Básico de Física', isFree: true, questions: generateQuestions([], 'Ingeniería', false) },
            { id: 's12', cat: 'Ingeniería', title: 'Simulacro Calculo Estructural', isFree: false, questions: generateQuestions([], 'Ingeniería', true) }
        ];

        const AuthStore = {
            getUser: () => JSON.parse(localStorage.getItem('certiprep_user')),
            setUser: (user) => localStorage.setItem('certiprep_user', JSON.stringify(user)),
            logout: () => localStorage.removeItem('certiprep_user'),
            
            getPayments: () => JSON.parse(localStorage.getItem('certiprep_payments')) || [],
            addPayment: (tx) => {
                const payments = AuthStore.getPayments();
                payments.push(tx);
                localStorage.setItem('certiprep_payments', JSON.stringify(payments));
            },

            getUsersDb: () => {
                let db = JSON.parse(localStorage.getItem('certiprep_users_db')) || [];
                // Asegurar que el admin siempre esté listado
                if(!db.find(u => u.email === 'admin@certiprep.ai')) {
                    db.unshift({
                        name: 'Administrador',
                        email: 'admin@certiprep.ai',
                        plan: 'Pro (Admin)',
                        registeredAt: '2026-01-01 10:00',
                        lastLogin: new Date().toLocaleString('es-CO'),
                        avatar: ''
                    });
                }
                return db;
            },
            updateUserDb: (email, newProps) => {
                let db = AuthStore.getUsersDb();
                const idx = db.findIndex(u => u.email === email);
                if(idx !== -1) {
                    db[idx] = { ...db[idx], ...newProps };
                    localStorage.setItem('certiprep_users_db', JSON.stringify(db));
                }
            }
        };

        const router = {
            navigate: (view, param = null) => {
                const container = document.getElementById('app-container');
                const user = AuthStore.getUser();
                
                const nav = document.getElementById('nav-actions');
                if (user) {
                    nav.innerHTML = `<button onclick="router.navigate('${user.role === 'admin' ? 'admin' : 'dashboard'}')" class="bg-brand-600 hover:bg-brand-500 text-white text-sm font-medium px-5 py-2.5 rounded-xl shadow-lg transition">Ir al Panel</button>`;
                } else {
                    nav.innerHTML = `
                        <button onclick="router.navigate('auth', 'login')" class="text-sm font-medium text-slate-300 hover:text-white px-4 py-2">Iniciar Sesión</button>
                        <button onclick="router.navigate('auth', 'register')" class="bg-brand-600 hover:bg-brand-500 text-white text-sm font-medium px-5 py-2.5 rounded-xl shadow-lg">Regístrate</button>
                    `;
                }

                window.scrollTo(0, 0);

                if (view === 'landing') container.innerHTML = renderLanding();
                else if (view === 'auth') container.innerHTML = renderAuth(param);
                else if (view === 'dashboard') {
                    if (!user) return router.navigate('auth', 'login');
                    if (user.role === 'admin') return router.navigate('admin');
                    container.innerHTML = renderDashboard(user);
                    if (currentDashboardTab !== 'ajustes') {
                        renderCatalog(user);
                    }
                }
                else if (view === 'admin') {
                    if (!user || user.role !== 'admin') return router.navigate('landing');
                    container.innerHTML = renderAdmin(user);
                }
                else if (view === 'course') container.innerHTML = renderCourseView(param);
                else if (view === 'simulator') container.innerHTML = renderSimulatorView(param);
            }
        };

        function renderLanding() {
            return `
                <section class="py-24 text-center px-4 flex-grow flex flex-col justify-center bg-gradient-to-b from-dark-900 to-dark-800">
                    <h1 class="text-5xl md:text-7xl font-extrabold text-white mb-6 tracking-tight">Aprende sin límites.</h1>
                    <p class="text-lg text-slate-400 max-w-2xl mx-auto mb-10 leading-relaxed">Únete a la plataforma con miles de módulos de Medicina, Tecnología, Negocios y Derecho. Textos inmersivos y simuladores impulsados por IA.</p>
                    <div class="flex flex-col sm:flex-row justify-center gap-4">
                        <button onclick="router.navigate('auth', 'register')" class="bg-brand-600 hover:bg-brand-500 text-white font-semibold px-8 py-4 rounded-xl shadow-lg shadow-brand-500/20 transition transform hover:-translate-y-1">Empieza Gratis Hoy</button>
                    </div>
                </section>
            `;
        }

        function renderAuth(mode) {
            const isLogin = mode === 'login';
            return `
                <div class="flex-grow flex items-center justify-center px-4 py-12">
                    <div class="bg-dark-800 border border-dark-700 rounded-2xl max-w-md w-full p-8 shadow-2xl">
                        <h2 class="text-2xl font-bold text-white text-center mb-2">${isLogin ? 'Iniciar Sesión' : 'Crear Cuenta'}</h2>
                        <p class="text-slate-400 text-center text-sm mb-6">${isLogin ? 'Ingresa tus credenciales' : 'Regístrate y luego inicia sesión'}</p>
                        
                        <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

                        <form onsubmit="handleAuth(event, '${mode}')" class="space-y-4">
                            ${!isLogin ? `
                                <div><label class="block text-xs text-slate-400 mb-1">Nombre</label><input type="text" id="auth-name" required class="w-full bg-dark-900 border border-dark-700 rounded-lg p-3 text-white focus:border-brand-500 outline-none"></div>
                            ` : ''}
                            <div><label class="block text-xs text-slate-400 mb-1">Correo Electrónico</label><input type="email" id="auth-email" required class="w-full bg-dark-900 border border-dark-700 rounded-lg p-3 text-white focus:border-brand-500 outline-none"></div>
                            <div><label class="block text-xs text-slate-400 mb-1">Contraseña</label><input type="password" id="auth-password" required class="w-full bg-dark-900 border border-dark-700 rounded-lg p-3 text-white focus:border-brand-500 outline-none"></div>
                            
                            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 rounded-lg transition mt-4">${isLogin ? 'Entrar' : 'Registrarse'}</button>
                        </form>
                        
                        <div class="mt-6 text-center text-sm text-slate-400">
                            <button onclick="router.navigate('auth', '${isLogin ? 'register' : 'login'}')" class="text-brand-400 hover:underline">${isLogin ? 'Crear una cuenta nueva' : 'Ya tengo cuenta. Iniciar sesión.'}</button>
                        </div>
                        ${isLogin ? `<p class="mt-4 text-xs text-center text-slate-500 border-t border-dark-700 pt-4">¿Eres administrador? Usa admin@certiprep.ai / admin123</p>` : ''}
                    </div>
                </div>
            `;
        }

        let currentFilter = 'Todos';
        let currentDashboardTab = 'cursos';

        function renderDashboard(user) {
            const isPro = user.plan === 'Pro';
            
            let categories = [];
            if (currentDashboardTab === 'cursos') {
                categories = ['Todos', ...new Set(coursesDB.map(i => i.cat))];
            } else if (currentDashboardTab === 'simulacros') {
                categories = ['Todos', ...new Set(simulatorsDB.map(i => i.cat))];
            }
            
            const filterHtml = categories.map(c => `
                <button onclick="applyFilter('${c}')" class="px-4 py-1.5 rounded-full text-sm font-medium transition ${currentFilter === c ? 'bg-brand-600 text-white' : 'bg-dark-800 text-slate-400 hover:bg-dark-700 hover:text-white'}">
                    ${c}
                </button>
            `).join('');

            const avatarHtml = user.avatar 
                ? `<img src="${user.avatar}" alt="Avatar" class="w-full h-full object-cover">`
                : `<span class="text-white font-bold text-xl">${user.name.charAt(0).toUpperCase()}</span>`;

            return `
                <div class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row gap-8 w-full">
                    <!-- SIDEBAR -->
                    <div class="w-full md:w-64 flex-shrink-0">
                        <div class="bg-dark-800 p-5 rounded-2xl border border-dark-700 mb-6 sticky top-24">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center overflow-hidden mb-3 shadow-md mx-auto">
                                ${avatarHtml}
                            </div>
                            <h3 class="font-bold text-white text-center truncate">${user.name}</h3>
                            <p class="text-xs text-slate-400 mb-3 truncate text-center">${user.email}</p>
                            <div class="text-center mb-3">
                                <div class="inline-flex px-3 py-1 rounded-full text-xs font-bold ${isPro ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-dark-900 text-slate-300 border border-dark-700'}">
                                    Membresía: ${user.plan}
                                </div>
                            </div>

        function renderSettingsTab(user) {

            user.avatar = newAvatar;
            
            AuthStore.setUser(user);
            AuthStore.updateUserDb(user.email, { name: newName, avatar: newAvatar });

        function renderCatalog(user) {

                        </div>
                        <span class="text-[10px] px-2 py-1 rounded-full font-bold uppercase tracking-wider ${item.isFree ? 'bg-teal-900/40 text-teal-400' : 'bg-amber-900/40 text-amber-400'}">

        function openContent(id, type, hasAccess) {

        function renderCourseView(courseId) {
            const course = coursesDB.find(c => c.id === courseId);
            const firstModule = course.modules[0];
            
            setTimeout(() => {
                document.getElementById('module-title').innerText = firstModule.title;
                document.getElementById('module-content').innerHTML = firstModule.content;
            }, 50);

            const modulesListHtml = course.modules.map((m, idx) => `
                <button onclick="loadModule('${courseId}', ${idx})" class="w-full text-left p-3 rounded-lg text-sm text-slate-300 hover:bg-dark-700 hover:text-white transition flex items-center gap-3 border border-transparent hover:border-dark-600 mb-2">

                    <span class="truncate">${m.title}</span>

            `).join('');

            return `
                <div class="flex flex-col h-[calc(100vh-64px)] bg-dark-900">
                    <div class="h-14 bg-dark-800 border-b border-dark-700 flex items-center px-4 justify-between flex-shrink-0">
                        <button onclick="router.navigate('dashboard')" class="text-sm font-medium text-slate-400 hover:text-white flex items-center gap-2 transition">

                        </button>

                    </div>
                    
                    <div class="flex flex-1 overflow-hidden">
                        <div class="w-80 bg-dark-800 border-r border-dark-700 overflow-y-auto p-4 hidden md:block flex-shrink-0">

        window.loadModule = function(cId, mIdx) {
            const course = coursesDB.find(c => c.id === cId);
            const mod = course.modules[mIdx];
            document.getElementById('module-title').innerText = mod.title;
            document.getElementById('module-content').innerHTML = mod.content;
            document.querySelector('.flex-1.overflow-y-auto').scrollTo(0, 0);
        };

        let currentSimState = { data: null, qIndex: 0, score: 0 };
        function renderSimulatorView(simId) {
            const sim = simulatorsDB.find(s => s.id === simId);
            currentSimState = { data: sim, qIndex: 0, score: 0 };
            
            setTimeout(() => loadQuestion(), 50);

            return `
                <div class="max-w-4xl mx-auto px-4 py-8">
                    <button onclick="router.navigate('dashboard')" class="text-sm font-medium text-slate-400 hover:text-white flex items-center gap-2 mb-6 transition">
                        <i class="fa-solid fa-arrow-left"></i> Abandonar Simulador
                    </button>
                    
                    <div class="bg-dark-800 border border-dark-700 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-dark-700">
                            <div id="sim-progress" class="h-full bg-brand-500 w-0 transition-all duration-300"></div>
                        </div>
                        
                        <div class="flex justify-between items-center mb-8 border-b border-dark-700 pb-4">
                            <h2 class="text-xl font-bold text-white">${sim.title}</h2>

                        </div>

                        <div id="sim-question-container"></div>
                        
                        <div id="sim-hint-box" class="hidden mt-6 p-4 bg-amber-900/20 border border-amber-800/50 rounded-xl text-amber-200 text-sm"></div>

                        <div class="mt-8 flex justify-between items-center pt-6 border-t border-dark-700">
                            <button onclick="showHint()" class="text-slate-400 hover:text-amber-400 text-sm font-medium transition flex items-center gap-2">
                                <i class="fa-solid fa-robot"></i> Pedir Pista IA
                            </button>
                            <button id="sim-next-btn" onclick="nextQuestion()" class="bg-brand-600 hover:bg-brand-500 text-white font-medium px-6 py-2.5 rounded-xl transition shadow-lg hidden">
                                Siguiente <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.loadQuestion = function() {
            const { data, qIndex } = currentSimState;
            const q = data.questions[qIndex];
            
            document.getElementById('sim-counter').innerText = `Pregunta ${qIndex + 1} / ${data.questions.length}`;
            document.getElementById('sim-progress').style.width = `${((qIndex) / data.questions.length) * 100}%`;
            document.getElementById('sim-hint-box').classList.add('hidden');
            document.getElementById('sim-next-btn').classList.add('hidden');

            let optionsHtml = q.options.map((opt, idx) => `
                <button onclick="selectOption(${idx})" id="opt-${idx}" class="w-full text-left p-4 rounded-xl border border-dark-600 bg-dark-900 hover:border-brand-500 transition mb-3 text-slate-200">
                    <span class="inline-block w-6 text-brand-500 font-bold">${String.fromCharCode(65 + idx)}.</span> ${opt}
                </button>
            `).join('');

            document.getElementById('sim-question-container').innerHTML = `
                <h3 class="text-lg md:text-xl font-medium text-white mb-6 leading-relaxed">${q.q}</h3>
                <div>${optionsHtml}</div>
            `;
        };

        window.selectOption = function(idx) {
            const { data, qIndex } = currentSimState;
            const q = data.questions[qIndex];
            const isCorrect = idx === q.answer;
            
            if(isCorrect) currentSimState.score++;
            
            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                btn.disabled = true;
                if(i === q.answer) {
                    btn.className = "w-full text-left p-4 rounded-xl border border-teal-500 bg-teal-900/30 text-white font-bold mb-3";
                } else if(i === idx && !isCorrect) {
                    btn.className = "w-full text-left p-4 rounded-xl border border-red-500 bg-red-900/30 text-white mb-3 line-through opacity-70";
                } else {
                    btn.className = "w-full text-left p-4 rounded-xl border border-dark-700 bg-dark-900 text-slate-500 mb-3 opacity-50";
                }
            });

            document.getElementById('sim-next-btn').classList.remove('hidden');
            
            const hintBox = document.getElementById('sim-hint-box');
            hintBox.innerHTML = `<strong>Análisis de la IA:</strong> ${isCorrect ? '¡Excelente deducción! ' : 'Incorrecto. '}${q.hint}`;
            hintBox.className = `mt-6 p-4 border rounded-xl text-sm ${isCorrect ? 'bg-teal-900/20 border-teal-800 text-teal-200' : 'bg-red-900/20 border-red-800 text-red-200'}`;
            hintBox.classList.remove('hidden');
        };

        window.showHint = function() {
            const q = currentSimState.data.questions[currentSimState.qIndex];
            const hintBox = document.getElementById('sim-hint-box');
            hintBox.innerHTML = `<strong>Pista IA:</strong> Piensa en esto: ${q.hint}`;
            hintBox.className = 'mt-6 p-4 bg-amber-900/20 border border-amber-800/50 rounded-xl text-amber-200 text-sm';
            hintBox.classList.remove('hidden');
        };

        window.nextQuestion = function() {
            currentSimState.qIndex++;
            if (currentSimState.qIndex < currentSimState.data.questions.length) {
                loadQuestion();
            } else {
                const percent = Math.round((currentSimState.score / currentSimState.data.questions.length) * 100);
                document.getElementById('sim-question-container').innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-24 h-24 rounded-full mx-auto flex items-center justify-center text-3xl font-bold mb-4 ${percent >= 70 ? 'bg-teal-900 text-teal-400 border-4 border-teal-500' : 'bg-red-900 text-red-400 border-4 border-red-500'}">
                            ${percent}%
                        </div>
                        <h3 class="text-2xl font-bold text-white mb-2">Simulacro Finalizado</h3>
                        <p class="text-slate-400 mb-8">Respondiste correctamente ${currentSimState.score} de ${currentSimState.data.questions.length} preguntas.</p>
                        <button onclick="router.navigate('dashboard')" class="bg-dark-700 hover:bg-dark-600 text-white px-6 py-2.5 rounded-xl transition">Volver al Panel</button>
                    </div>
                `;
                document.getElementById('sim-next-btn').style.display = 'none';
                document.getElementById('sim-hint-box').style.display = 'none';
                document.getElementById('sim-progress').style.width = '100%';
            }
        };

        function handleAuth(e, mode) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const alertBox = document.getElementById('auth-alert');
            
            try {
                if (mode === 'register') {
                    const name = document.getElementById('auth-name').value.trim();
                    if(email === 'admin@certiprep.ai') throw new Error("Correo reservado.");
                    
                    let userDb = JSON.parse(localStorage.getItem('certiprep_users_db')) || [];
                    if(userDb.find(u => u.email === email)) throw new Error("El correo ya está registrado.");
                    
                    const newUserRecord = { 
                        name, 
                        email, 
                        password, 
                        plan: 'Básico', 
                        role: 'student',
                        registeredAt: new Date().toLocaleString('es-CO'),
                        lastLogin: new Date().toLocaleString('es-CO'),
                        avatar: ''
                    };
                    
                    userDb.push(newUserRecord);
                    localStorage.setItem('certiprep_users_db', JSON.stringify(userDb));
                    
                    alertBox.innerText = "¡Cuenta creada con éxito! Ahora inicia sesión.";
                    alertBox.className = "mb-4 p-3 rounded-lg text-sm font-medium bg-teal-900/30 border border-teal-800 text-teal-300";
                    alertBox.classList.remove('hidden');
                    
                    setTimeout(() => router.navigate('auth', 'login'), 2000);
                } else {
                    if (email === 'admin@certiprep.ai' && password === 'admin123') {
                        const adminUser = { email: 'admin@certiprep.ai', name: 'Administrador', role: 'admin' };
                        AuthStore.setUser(adminUser);
                        return router.navigate('admin');
                    }
                    
                    let userDb = JSON.parse(localStorage.getItem('certiprep_users_db')) || [];
                    const found = userDb.find(u => u.email === email && u.password === password);
                    if (!found) throw new Error("Credenciales incorrectas.");
                    
                    // Actualizar último login en la base de datos
                    AuthStore.updateUserDb(email, { lastLogin: new Date().toLocaleString('es-CO') });
                    
                    AuthStore.setUser(found);
                    router.navigate('dashboard');
                }
            } catch(error) {
                alertBox.innerText = error.message;
                alertBox.className = "mb-4 p-3 rounded-lg text-sm font-medium bg-red-900/30 border border-red-800 text-red-300";
                alertBox.classList.remove('hidden');
            }
        }

        function handleLogout() {
            AuthStore.logout();
            router.navigate('landing');
        }

        function simulateWompiPayment() {
            const modalHtml = `
                <div id="wompi-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-[fadeIn_0.3s_ease-out]">
                    <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
                        <div class="bg-[#002B5E] p-4 text-white flex justify-between items-center">
                            <div class="font-bold text-lg tracking-wider">Wompi.</div>
                            <div class="text-sm font-medium opacity-80">Modo Pruebas</div>
                        </div>
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-slate-800 mb-1">Membresía PRO Ilimitada</h3>
                            <p class="text-slate-500 text-sm mb-6">CertiPrep AI S.A.S</p>
                            
                            <div class="bg-slate-100 rounded-xl p-4 flex justify-between items-center mb-6">
                                <span class="text-slate-600 font-medium">Total a pagar</span>
                                <span class="text-2xl font-black text-slate-900">$116.000 COP</span>
                            </div>
                            
                            <p class="text-xs text-slate-500 mb-4 text-center">Haz clic en aprobar para activar tu membresía.</p>
                            
                            <button onclick="processWompiSuccess()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/30 transition transform hover:-translate-y-1 mb-3">
                                Aprobar Pago de Prueba ($116.000)
                            </button>
                            <button onclick="document.getElementById('wompi-modal').remove()" class="w-full bg-transparent text-slate-500 hover:text-slate-700 font-medium py-2 transition">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function processWompiSuccess() {
            document.getElementById('wompi-modal').remove();
            try {
                const currentUser = AuthStore.getUser();
                currentUser.plan = 'Pro';
                AuthStore.setUser(currentUser);
                
                AuthStore.updateUserDb(currentUser.email, { plan: 'Pro' });
                
                const tx = {
                    date: new Date().toLocaleString('es-CO'),
                    userEmail: currentUser.email,
                    amount: 116000,
                    txId: 'TX-WP-' + Math.floor(Math.random() * 1000000000)
                };
                AuthStore.addPayment(tx);
                
                alert("¡Transacción Aprobada! Tu membresía PRO ha sido activada.");
                router.navigate('dashboard');
                
            } catch(e) {
                alert("Ocurrió un error al procesar tu pago.");
            }
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }`;
        document.head.appendChild(style);

        window.addEventListener('DOMContentLoaded', () => {
            router.navigate('landing');
        });
    </script>
