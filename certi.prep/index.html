        // Función para mostrar mensajes flotantes en pantalla (éxito, error, info)
        function showNotification(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Definir colores según el tipo de alerta
            const colors = type === 'error' ? 'bg-red-900 border-red-700 text-red-200' : 
                           type === 'success' ? 'bg-emerald-900 border-emerald-700 text-emerald-200' :
                           'bg-dark-800 border-dark-700 text-white';
            
            // Definir ícono según el tipo de alerta
            const icon = type === 'error' ? 'fa-circle-xmark' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info';
            
            // Construir el HTML del Toast
            toast.className = `p-4 rounded-xl border shadow-2xl flex items-center gap-3 text-sm toast-enter pointer-events-auto ${colors}`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="flex-grow">${msg}</span><button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>`;
            
            container.appendChild(toast);
            
            // Animación de entrada
            setTimeout(() => toast.classList.add('toast-active'), 10);
            // Animación de salida y destrucción del elemento después de 4 segundos
            setTimeout(() => { toast.classList.remove('toast-active'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

           ==================================================================================== */

            // Los usuarios premium reciben 5 veces más contenido (simulando miles de palabras)
            const loops = isPremium ? 5 : 2; 
            let fullHtml = '';
            
            for(let i = 0; i < loops; i++) {
                fullHtml += `
                    <div class="flex flex-col xl:flex-row gap-8 mb-12 border-b border-dark-700/50 pb-10">

                            <p>El estudio exhaustivo de ${topic} en este módulo #${moduleNum} representa un pilar fundamental para cualquier profesional moderno. La evolución constante del sector exige no solo memorización superficial, sino una comprensión analítica profunda. Aplicar principios sólidos y metodologías estructuradas en ${topic} reduce márgenes de error operativo y permite escalar procesos manteniendo la estabilidad estructural y técnica a largo plazo. Las métricas de la industria reciente indican que la optimización rigurosa de estos procesos específicos mejora los resultados corporativos y clínicos en un 40% durante el primer trimestre de implementación.</p>
                            
                            <p>Profundizando en los detalles técnicos, es de vital importancia reconocer e interpretar las múltiples variables que afectan el rendimiento del ecosistema. La arquitectura subyacente y los protocolos establecidos deben evaluarse y auditarse constantemente. Implementar estas auditorías de control de calidad y cumplir rigurosamente con los estándares internacionales asegura soluciones innovadoras y altamente resilientes ante posibles fallas sistémicas. El manejo inadecuado o la negligencia de estas directrices impone riesgos severos y cuantiosas penalizaciones de cumplimiento normativo en entornos reales y competitivos.</p>
                            
                            <div class="bg-dark-800/80 p-6 rounded-xl border-l-4 border-brand-500 my-8 shadow-md">
                                <h4 class="font-bold text-white mb-2"><i class="fa-solid fa-brain text-brand-400 mr-2"></i>Pregunta de Reflexión Intelectual:</h4>
                                <p class="text-sm text-slate-300 italic mb-0">Basado en el análisis crítico anterior sobre ${topic}, ¿qué estrategias preventivas y de mitigación de daños implementaría usted de manera prioritaria si se detecta una vulnerabilidad crítica o un cuello de botella que afecta al 50% de la infraestructura o proceso actual?</p>
                            </div>
                            
                            <p>En conclusión para esta extensa sección teórica, el dominio absoluto de los temas tratados proporciona una ventaja competitiva innegable en el mercado laboral actual. El análisis empírico demuestra que la proactividad en la identificación temprana de riesgos diferencia marcadamente los proyectos y profesionales exitosos de los deficientes. Es un imperativo categórico mantener una cultura de aprendizaje continuo, adaptación tecnológica y revisión exhaustiva por pares para fomentar soluciones robustas, éticas y escalables dentro de cualquier organización de alto rendimiento.</p>

                            <div><label class="block text-xs text-slate-400 mb-1">Contraseña</label><input type="password" id="auth-password" required class="w-full bg-dark-900 border border-dark-700 rounded-xl p-3 text-white outline-none focus:border-brand-500"></div>
                            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg mt-2">${isLogin ? 'Ingresar a mi panel' : 'Registrarme'}</button>
                        </form>
                        <div class="mt-6 text-center text-sm text-slate-400">
                            <button onclick="router.navigate('auth', '${isLogin ? 'register' : 'login'}')" class="text-brand-400 hover:underline">${isLogin ? 'No tengo cuenta. Registrarme.' : 'Ya tengo cuenta. Ingresar.'}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Panel de Usuario (Dashboard) con Pestañas
        function renderDashboard(user) {
            const isPro = user.plan?.includes('Pro');
            // Botones de filtro dinámicos basados en la categoría
            let categories = ['Todos', 'Tecnología', 'Medicina', 'Negocios', 'Derecho'];
            const filterHtml = categories.map(c => `<button onclick="applyFilter('${c}')" class="px-5 py-2 rounded-full text-sm font-medium transition ${currentFilter === c ? 'bg-brand-600 text-white shadow-lg' : 'bg-dark-800 text-slate-400 hover:bg-dark-700 hover:text-white border border-dark-700'}">${c}</button>`).join('');

            return `
                <div class="max-w-7xl mx-auto px-4 py-8 flex flex-col lg:flex-row gap-8 w-full">
                    <!-- Columna Izquierda: Perfil de Usuario -->
                    <div class="w-full lg:w-72 flex-shrink-0">
                        <div class="bg-dark-800 p-6 rounded-2xl border border-dark-700 mb-6 sticky top-24 shadow-xl">
                            <div class="w-20 h-20 rounded-full bg-brand-600 flex items-center justify-center overflow-hidden mb-4 shadow-lg mx-auto text-white text-2xl font-bold border-2 border-brand-500/50">
                                ${user.avatar ? `<img src="${user.avatar}" class="w-full h-full object-cover">` : user.name.charAt(0).toUpperCase()}
                            </div>
                            <h3 class="font-bold text-white text-center text-lg truncate">${user.name}</h3>
                            <p class="text-sm text-slate-400 mb-4 truncate text-center">${user.email}</p>
                            <div class="text-center mb-5"><span class="px-4 py-1.5 rounded-full text-xs font-bold ${isPro ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-dark-900 text-slate-300 border border-dark-700'}">Membresía: ${user.plan}</span></div>
                            
                            <!-- Botón de Pago Wompi (Solo si es Gratis) -->
                            ${!isPro ? `<button onclick="payWithWompi(0, 'Membresía PRO CertiPrep')" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-3 rounded-xl shadow-lg transition flex justify-center items-center gap-2"><i class="fa-solid fa-bolt"></i> Desbloquear Pro ($50k)</button>` : ''}
                            
                            <!-- Menú de Pestañas -->
                            <div class="mt-6 border-t border-dark-700 pt-5 space-y-2">
                                <button onclick="switchDashboardTab('cursos')" class="w-full text-left px-4 py-3 rounded-xl transition text-sm font-medium flex items-center gap-3 ${currentDashboardTab === 'cursos' ? 'bg-brand-900/50 text-brand-400 border border-brand-800' : 'text-slate-400 hover:bg-dark-700'}"><i class="fa-solid fa-book-open w-5"></i> Cursos Detallados</button>
                                <button onclick="switchDashboardTab('simulacros')" class="w-full text-left px-4 py-3 rounded-xl transition text-sm font-medium flex items-center gap-3 ${currentDashboardTab === 'simulacros' ? 'bg-brand-900/50 text-brand-400 border border-brand-800' : 'text-slate-400 hover:bg-dark-700'}"><i class="fa-solid fa-laptop-code w-5"></i> Simuladores IA</button>
                                <button onclick="switchDashboardTab('ajustes')" class="w-full text-left px-4 py-3 rounded-xl transition text-sm font-medium flex items-center gap-3 ${currentDashboardTab === 'ajustes' ? 'bg-brand-900/50 text-brand-400 border border-brand-800' : 'text-slate-400 hover:bg-dark-700'}"><i class="fa-solid fa-gear w-5"></i> Ajustes de Perfil</button>
                            </div>
                            <button onclick="AuthStore.logout()" class="w-full mt-8 text-red-400 hover:text-red-300 text-sm font-medium text-left px-4 flex items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</button>
                        </div>
                    </div>
                    
                    <!-- Columna Derecha: Contenido Dinámico según la Pestaña -->
                    <div class="flex-grow">
                        ${currentDashboardTab !== 'ajustes' ? `<div class="flex overflow-x-auto pb-4 mb-6 gap-3 no-scrollbar">${filterHtml}</div>` : ''}
                        ${currentDashboardTab === 'cursos' ? `<h2 class="text-2xl font-bold text-white mb-6 border-b border-dark-800 pb-2">Cursos Académicos Exhaustivos</h2><div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>` : ''}
                        ${currentDashboardTab === 'simulacros' ? `<h2 class="text-2xl font-bold text-white mb-6 border-b border-dark-800 pb-2">Simuladores de Examen Oficiales</h2><div id="simulators-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>` : ''}
                        ${currentDashboardTab === 'ajustes' ? renderSettingsTab(user) : ''}
                    </div>
                </div>
            `;
        }

        // Función para cambiar entre Pestañas en el Dashboard
        function switchDashboardTab(tab) {
            currentDashboardTab = tab;
            currentFilter = 'Todos';
            const user = AuthStore.getUser();
            document.getElementById('app-container').innerHTML = renderDashboard(user);
            if(tab !== 'ajustes') renderCatalog(user);
        }

        // Pestaña de Edición de Perfil y Avatar
        function renderSettingsTab(user) {
            return `
                <div class="bg-dark-800 border border-dark-700 rounded-2xl p-8 max-w-2xl shadow-xl">
                    <h2 class="text-2xl font-bold text-white mb-6 border-b border-dark-700 pb-4">Editar Perfil</h2>
                    <form onsubmit="handleUpdateProfile(event)" class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-2">Nombre Completo</label>
                            <input type="text" id="profile-name" value="${user.name}" required class="w-full bg-dark-900 border border-dark-700 rounded-xl p-3.5 text-white focus:border-brand-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-2">Correo (Solo lectura)</label>
                            <input type="email" value="${user.email}" readonly class="w-full bg-dark-900/50 border border-dark-700/50 rounded-xl p-3.5 text-slate-500 cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-2">URL de Foto de Perfil (Avatar)</label>
                            <input type="url" id="profile-avatar" value="${user.avatar || ''}" placeholder="https://ejemplo.com/mifoto.jpg" class="w-full bg-dark-900 border border-dark-700 rounded-xl p-3.5 text-white focus:border-brand-500 outline-none transition">
                            <p class="text-xs text-slate-500 mt-2">Pega la URL pública de una imagen para actualizar tu avatar en el menú lateral y en el panel de administrador.</p>
                        </div>
                        <button type="submit" class="bg-brand-600 hover:bg-brand-500 text-white font-medium px-8 py-3.5 rounded-xl transition shadow-lg mt-4">Guardar Cambios</button>
                    </form>
                </div>
            `;
        }

        // Procesar cambios en el perfil
        function handleUpdateProfile(e) {
            e.preventDefault();
            const newName = document.getElementById('profile-name').value.trim();
            const newAvatar = document.getElementById('profile-avatar').value.trim();
            
            let user = AuthStore.getUser();
            user.name = newName;
            user.avatar = newAvatar;
            
            // Guardar cambios en sesión local y en la "Base de Datos" local
            AuthStore.setUser(user);
            AuthStore.updateUserDb(user.email, { name: newName, avatar: newAvatar });
            
            showNotification("¡Perfil actualizado con éxito!", "success");
            router.navigate('dashboard');
        }

        // Renderizar las Tarjetas de Catálogo (Cursos o Simulacros)
        function renderCatalog(user) {
            const isPro = user.plan?.includes('Pro');
            if (currentDashboardTab === 'cursos') {
                const filtered = currentFilter === 'Todos' ? coursesDB : coursesDB.filter(c => c.cat === currentFilter);
                document.getElementById('courses-grid').innerHTML = filtered.map(c => createCardHtml(c, isPro, 'course')).join('');
            } else if (currentDashboardTab === 'simulacros') {
                const filtered = currentFilter === 'Todos' ? simulatorsDB : simulatorsDB.filter(s => s.cat === currentFilter);
                document.getElementById('simulators-grid').innerHTML = filtered.map(s => createCardHtml(s, isPro, 'simulator')).join('');
            }
        }

        function applyFilter(cat) {
            currentFilter = cat;
            const user = AuthStore.getUser();
            document.getElementById('app-container').innerHTML = renderDashboard(user);
            renderCatalog(user);
        }

        // Generar HTML de cada Tarjeta
        function createCardHtml(item, isPro, type) {
            const hasAccess = item.isFree || isPro;
            const unit = type === 'course' ? `${item.modules.length} Módulos de texto extendido` : `${item.questions.length} Preguntas adaptativas con IA`;
            return `
                <div class="bg-dark-800 border border-dark-700 rounded-2xl p-6 hover:border-brand-500 transition shadow-lg flex flex-col h-full">
                    <div class="flex justify-between items-start mb-5">
                        <div class="w-12 h-12 rounded-xl bg-dark-900 flex items-center justify-center text-brand-400 text-xl"><i class="fa-solid ${item.icon || 'fa-laptop-code'}"></i></div>
                        <span class="text-xs px-3 py-1 rounded-full font-bold uppercase ${item.isFree ? 'bg-teal-900/40 text-teal-400 border border-teal-800/50' : 'bg-amber-900/40 text-amber-400 border border-amber-800/50'}">${item.isFree ? 'Gratis' : 'Premium'}</span>
                    </div>
                    <span class="text-xs font-semibold text-brand-500 mb-2 tracking-wider uppercase">${item.cat}</span>
                    <h3 class="text-xl font-bold text-white mb-3">${item.title}</h3>
                    <p class="text-sm text-slate-400 mb-8 flex-grow"><i class="fa-regular fa-folder-open mr-2"></i> ${unit}</p>
                    <button onclick="if(${hasAccess}) router.navigate('${type}', '${item.id}'); else showNotification('Este contenido requiere Membresía Pro.', 'error');" class="w-full py-3 rounded-xl text-sm font-bold transition ${hasAccess ? 'bg-brand-600 hover:bg-brand-500 text-white shadow-lg' : 'bg-dark-900 border border-dark-700 text-slate-500'}">${hasAccess ? 'Comenzar Ahora' : 'Bloqueado (Requiere Pro)'}</button>
                </div>
            `;
        }

        // Vista de Curso Individual (Lector de Módulos)
        function renderCourseView(courseId) {
            const course = coursesDB.find(c => c.id === courseId);
            setTimeout(() => { loadModule(courseId, 0); }, 50); // Cargar el primer módulo por defecto
            
            // Generar botones laterales para navegar entre módulos (¡Aquí se corrigió el error de comillas!)
            const modulesListHtml = course.modules.map((m, idx) => `<button onclick="loadModule('${courseId}', ${idx})" class="w-full text-left p-4 rounded-xl text-sm font-medium text-slate-300 hover:bg-brand-900/40 hover:text-brand-400 transition mb-2 border border-transparent hover:border-brand-800/50"><i class="fa-solid fa-bookmark mr-2 opacity-50"></i> ${idx+1}. ${m.title}</button>`).join('');
            
            return `
                <div class="flex flex-col h-[calc(100vh-64px)] bg-dark-900">
                    <div class="h-16 bg-dark-800 border-b border-dark-700 flex items-center px-6 justify-between flex-shrink-0 shadow-sm z-10">
                        <button onclick="router.navigate('dashboard')" class="text-sm font-medium text-slate-400 hover:text-white flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Volver al Panel</button>
                        <h2 class="text-white font-bold truncate text-lg">${course.title}</h2>
                    </div>
                    <div class="flex flex-1 overflow-hidden relative">
                        <div class="w-80 bg-dark-800 border-r border-dark-700 overflow-y-auto p-4 hidden lg:block shadow-xl z-0">${modulesListHtml}</div>
                        <div class="flex-1 overflow-y-auto p-6 lg:p-12 scroll-smooth">
                            <div class="max-w-4xl mx-auto">
                                <h1 id="module-title" class="text-4xl font-extrabold text-white mb-8 tracking-tight"></h1>
                                <div id="module-content"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Función para inyectar el contenido del módulo seleccionado en el lector
        function loadModule(cId, mIdx) {
            const course = coursesDB.find(c => c.id === cId);
            const mod = course.modules[mIdx];
            document.getElementById('module-title').innerText = mod.title;
            document.getElementById('module-content').innerHTML = mod.content;
            window.scrollTo(0,0);
        }

        // Variables globales para mantener el estado del simulador activo
        let currentSim = null;
        
        // Vista Principal del Simulador
        function renderSimulatorView(simId) {
            const sim = simulatorsDB.find(s => s.id === simId);
            currentSim = { data: sim, qIdx: 0, score: 0 };
            setTimeout(() => loadQuestion(), 50);
            return `
                <div class="max-w-4xl mx-auto px-4 py-8 w-full">
                    <button onclick="router.navigate('dashboard')" class="text-sm font-medium text-slate-400 hover:text-white flex items-center gap-2 mb-8"><i class="fa-solid fa-arrow-left"></i> Salir del Simulador</button>
                    <div class="bg-dark-800 border border-dark-700 rounded-3xl p-8 shadow-2xl">
                        <div class="flex justify-between items-center mb-8 border-b border-dark-700 pb-5">
                            <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-stopwatch mr-2 text-brand-500"></i> ${sim.title}</h2>
                            <span id="sim-counter" class="bg-dark-900 border border-dark-700 px-4 py-1.5 rounded-full text-brand-400 font-medium text-sm shadow-inner"></span>
                        </div>
                        <div id="sim-question-container" class="min-h-[250px]"></div>
                        <div id="sim-hint-box" class="hidden mt-8 p-5 bg-indigo-900/20 border border-indigo-800/50 rounded-xl text-indigo-200 text-sm leading-relaxed shadow-inner"></div>
                        <div class="mt-8 flex justify-between pt-6 border-t border-dark-700">
                            <button onclick="showHint()" class="text-slate-400 hover:text-brand-400 font-medium text-sm transition"><i class="fa-solid fa-robot mr-2"></i> Explicación IA</button>
                            <button id="sim-next-btn" onclick="nextQuestion()" class="bg-brand-600 hover:bg-brand-500 text-white font-medium px-8 py-2.5 rounded-xl hidden shadow-lg transition">Siguiente Pregunta <i class="fa-solid fa-arrow-right ml-2"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Cargar pregunta actual
        function loadQuestion() {
            const { data, qIdx } = currentSim;
            const q = data.questions[qIdx];
            document.getElementById('sim-counter').innerText = `Pregunta ${qIdx + 1} de ${data.questions.length}`;
            document.getElementById('sim-hint-box').classList.add('hidden');
            document.getElementById('sim-next-btn').classList.add('hidden');
            
            let opts = q.options.map((opt, idx) => `<button onclick="selectOption(${idx})" id="opt-${idx}" class="w-full text-left p-5 rounded-xl border border-dark-600 bg-dark-900 hover:border-brand-500 mb-4 text-slate-200 transition shadow-sm leading-relaxed"><span class="font-bold text-slate-500 mr-2">${String.fromCharCode(65 + idx)}.</span> ${opt}</button>`).join('');
            document.getElementById('sim-question-container').innerHTML = `<h3 class="text-lg md:text-xl font-medium text-white mb-8 leading-relaxed">${q.q}</h3><div>${opts}</div>`;
        }

        // Evaluar opción seleccionada
        function selectOption(idx) {
            const { data, qIdx } = currentSim;
            const q = data.questions[qIdx];
            const isCorrect = idx === q.answer;
            if(isCorrect) currentSim.score++;
            
            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                btn.disabled = true;
                if(i === q.answer) btn.className = "w-full text-left p-5 rounded-xl border-2 border-emerald-500 bg-emerald-900/20 text-white font-bold mb-4 flex justify-between items-center";
                else if(i === idx) btn.className = "w-full text-left p-5 rounded-xl border-2 border-red-500 bg-red-900/20 text-white mb-4";
                else btn.className = "w-full text-left p-5 rounded-xl border border-dark-700 bg-dark-900/50 text-slate-500 mb-4 opacity-50";
            });
            document.getElementById('sim-next-btn').classList.remove('hidden');
            const hint = document.getElementById('sim-hint-box');
            hint.innerHTML = `<div class="font-bold mb-1 ${isCorrect ? 'text-emerald-400' : 'text-red-400'}"><i class="fa-solid ${isCorrect ? 'fa-check-circle' : 'fa-xmark-circle'} mr-1"></i> ${isCorrect ? '¡Respuesta Correcta!' : 'Respuesta Incorrecta'}</div>${q.hint}`;
            hint.classList.remove('hidden');
        }

        // Mostrar pista de IA
        function showHint() {
            const q = currentSim.data.questions[currentSim.qIdx];
            const hint = document.getElementById('sim-hint-box');
            if(hint.classList.contains('hidden')) {
                hint.innerHTML = `<strong><i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Pista del Tutor IA:</strong><br><br>${q.hint}`;
                hint.classList.remove('hidden');
            }
        }

        // Avanzar o terminar simulacro
        function nextQuestion() {
            currentSim.qIdx++;
            if(currentSim.qIdx < currentSim.data.questions.length) loadQuestion();
            else {
                const total = currentSim.data.questions.length;
                const pct = Math.round((currentSim.score / total) * 100);
                const passed = pct >= 70;
                document.getElementById('sim-question-container').innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-24 h-24 rounded-full ${passed ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'} flex items-center justify-center text-4xl mx-auto mb-6">
                            <i class="fa-solid ${passed ? 'fa-trophy' : 'fa-triangle-exclamation'}"></i>
                        </div>
                        <h3 class="text-3xl font-bold text-white mb-2">Simulacro Finalizado</h3>
                        <p class="text-slate-400 mb-8 text-lg">Puntaje Final: <span class="font-bold ${passed ? 'text-emerald-400' : 'text-red-400'}">${pct}%</span> (${currentSim.score} de ${total})</p>
                        <button onclick="router.navigate('dashboard')" class="bg-brand-600 hover:bg-brand-500 text-white font-medium px-8 py-3.5 rounded-xl transition shadow-lg">Volver al Panel Principal</button>
                    </div>
                `;
                document.getElementById('sim-next-btn').classList.add('hidden');
                document.getElementById('sim-hint-box').classList.add('hidden');
            }
        }

        // Vista de Administrador Global (Emulando dashboard de Supabase)

            const users = AuthStore.getUsersDb();
            const total = payments.reduce((acc, curr) => acc + curr.amount, 0);

            const usersRows = users.map(u => `
                <tr class="border-b border-dark-700 hover:bg-dark-700/50 transition">

                        </div>
                        <span class="font-semibold text-white truncate max-w-[150px]">${u.name}</span>
                    </td>
                    <td class="p-4 text-slate-300 text-sm">${u.email}</td>
                    <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${u.plan?.includes('Pro') ? 'bg-amber-500/20 text-amber-400 border border-amber-800/50' : 'bg-dark-900 text-slate-300 border border-dark-600'}">${u.plan || 'Básico'}</span></td>
                    <td class="p-4 text-xs text-slate-400">${u.registeredAt}</td>
                    <td class="p-4 text-xs text-slate-400">${u.lastLogin}</td>
                    <td class="p-4 text-center">
                        <!-- BOTÓN DE ELIMINAR USUARIO -->
                        <button onclick="deleteUserProfile('${u.email}')" class="bg-red-900/50 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg border border-red-800 transition text-xs font-bold shadow" title="Eliminar Usuario">
                            <i class="fa-solid fa-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
            `).join('');

            return `
                <div class="max-w-7xl mx-auto px-4 py-12 space-y-8 w-full">
                    <div class="flex items-center justify-between border-b border-dark-700 pb-6">
                        <h2 class="text-3xl font-bold text-white"><i class="fa-solid fa-shield-halved text-brand-500 mr-3"></i> Panel de Administración</h2>
                        <span class="bg-brand-900/50 border border-brand-500 text-brand-300 px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider">Modo SuperAdmin</span>
                    </div>
                    
                    <!-- Tarjetas de Métricas -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-dark-800 p-8 rounded-2xl border border-dark-700 shadow-xl relative overflow-hidden">
                            <i class="fa-solid fa-sack-dollar absolute -right-4 -bottom-4 text-8xl text-dark-700/30"></i>
                            <div class="text-slate-400 text-sm font-medium mb-1 relative z-10">Ingresos Brutos Wompi</div>
                            <div class="text-4xl font-extrabold text-emerald-400 relative z-10">$${total.toLocaleString()} <span class="text-lg text-emerald-600">COP</span></div>
                        </div>
                        <div class="bg-dark-800 p-8 rounded-2xl border border-dark-700 shadow-xl relative overflow-hidden">
                            <i class="fa-solid fa-credit-card absolute -right-4 -bottom-4 text-8xl text-dark-700/30"></i>
                            <div class="text-slate-400 text-sm font-medium mb-1 relative z-10">Transacciones Exitosas</div>
                            <div class="text-4xl font-extrabold text-white relative z-10">${payments.length}</div>
                        </div>
                        <div class="bg-dark-800 p-8 rounded-2xl border border-dark-700 shadow-xl relative overflow-hidden">
                            <i class="fa-solid fa-users absolute -right-4 -bottom-4 text-8xl text-dark-700/30"></i>
                            <div class="text-slate-400 text-sm font-medium mb-1 relative z-10">Usuarios Registrados</div>
                            <div class="text-4xl font-extrabold text-brand-400 relative z-10">${users.length}</div>
                        </div>
                    </div>

                    <!-- Tabla Estilo Supabase -->
                    <div class="bg-dark-800 rounded-2xl border border-dark-700 overflow-hidden shadow-2xl mt-8">
                        <div class="p-6 border-b border-dark-700 bg-dark-900/50 flex justify-between items-center">
                            <h3 class="text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-database text-brand-400"></i> Tabla 'public.users'</h3>
                            <button onclick="router.navigate('admin')" class="text-xs text-brand-400 hover:text-brand-300 font-medium bg-brand-900/30 px-3 py-1.5 rounded-lg border border-brand-800 transition"><i class="fa-solid fa-arrows-rotate mr-1"></i> Refrescar DB</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-dark-900 text-slate-400 uppercase text-xs font-semibold tracking-wider">

        /**
         * Función para eliminar un perfil de usuario desde el panel de Admin
         */
        async function deleteUserProfile(email) {
            // Evitar que el administrador principal se elimine a sí mismo
            if (email === 'admin@certiprep.ai') {
                showNotification("No puedes eliminar la cuenta del administrador principal del sistema.", "error");
                return;
            }

            const confirmar = confirm('¿Estás seguro de que deseas eliminar permanentemente a este usuario? Esta acción no se puede deshacer.');
            
            if (!confirmar) return;

            try {
                // 1. Eliminar de Supabase (Si está conectado)
                if (supabaseClient) {
                    // Nota: Cambia 'users' por el nombre real de tu tabla si se llama diferente en Supabase
                    const { error } = await supabaseClient
                        .from('users') 
                        .delete()
                        .eq('email', email);

                    if (error) throw error;
                }

                // 2. Eliminar de la base de datos local (Fallback para que funcione aquí en la prueba)
                let db = AuthStore.getUsersDb();
                db = db.filter(u => u.email !== email);
                localStorage.setItem('certiprep_users_db', JSON.stringify(db));

                // 3. Notificar éxito y recargar la tabla visualmente
                showNotification('Perfil de usuario eliminado correctamente.', 'success');
                router.navigate('admin'); // Recargar la vista de administrador
                
            } catch (error) {
                console.error('Error al eliminar usuario:', error);
                showNotification('Hubo un error al intentar eliminar el usuario: ' + error.message, 'error');
            }
        }

// Procesamiento del formulario de Inicio de sesión / Registro conectado a Supabase y Roles
async function handleAuth(e, mode) {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    
    try {
        if (mode === 'register') {
            const name = document.getElementById('auth-name').value.trim();
            
            // 1. Guardar en Supabase (Por defecto se registran como 'student')
            if (supabaseClient) {
                const { error } = await supabaseClient
                    .from('users')
                    .insert([
                        { 
                            name: name, 
                            email: email, 
                            password: password, 
                            plan: 'Básico', 
                            role: 'student', // <-- Rol por defecto
                            registeredAt: new Date().toLocaleString('es-CO'),
                            lastLogin: new Date().toLocaleString('es-CO'),
                            avatar: ''
                        }
                    ]);
                
                if (error) {
                    if (error.code === '23505') throw new Error("Este correo ya está registrado en Supabase.");
                    throw new Error(error.message);
                }
            }

            // 2. Respaldo local
            let db = AuthStore.getUsersDb();
            if(db.find(u => u.email === email)) throw new Error("Este correo ya está registrado en el sistema.");
            
            db.push({ 
                name, email, password, plan: 'Básico', role: 'student',
                registeredAt: new Date().toLocaleString('es-CO'), 
                lastLogin: new Date().toLocaleString('es-CO'), avatar: '' 
            });
            localStorage.setItem('certiprep_users_db', JSON.stringify(db));

            showNotification("¡Registro exitoso! Ya puedes iniciar sesión.", "success");
            setTimeout(() => router.navigate('auth', 'login'), 1500);

        } else {
            let loggedUser = null;

            // 1. Intentar validar el inicio de sesión consultando la base de datos de Supabase
            if (supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .single();

                if (data) {
                    loggedUser = data; // Obtenemos los datos y el rol directamente de Supabase
                }
            }

            // 2. Si no está en Supabase, buscar en el respaldo local (Bypass para el admin principal o pruebas)
            if (!loggedUser) {
                if (email === 'admin@certiprep.ai' && password === 'admin') {
                    loggedUser = { email, name: 'Admin Principal', role: 'admin', plan: 'Pro (Admin)' };
                } else {
                    let db = AuthStore.getUsersDb();
                    let found = db.find(u => u.email === email && u.password === password);
                    if (!found) throw new Error("Credenciales inválidas o cuenta inexistente.");
                    loggedUser = found;
                }
            }

            // Guardar sesión actual
            AuthStore.setUser(loggedUser);

            // Redirigir según el rol que tenga en la base de datos
            if (loggedUser.role === 'admin') {
                router.navigate('admin');
            } else {
                router.navigate('dashboard');
            }
        }
    } catch(err) {
        showNotification(err.message, "error");
    }
}

async function payWithWompi(amountInCents, productName) {
    // Tu llave pública real de producción de Wompi
    const WOMPI_PUBLIC_KEY = 'pub_prod_Cku7YXMh34ncyvyPeMv5zpiCsfgMAV8R'; 
    const referenceTx = 'CERTIPREP-TX-' + Date.now();
    
    // Verificar si el script de Wompi cargó correctamente
    if (typeof WidgetCheckout === 'undefined') {
        showNotification("La librería de Wompi no se ha cargado. Verifica tu conexión o bloqueadores.", "error");
        return;
    }

    try {
        console.log("Inicializando Wompi con:", { amountInCents, referenceTx, WOMPI_PUBLIC_KEY });

        // Inicializar el widget oficial de Wompi Colombia
        var checkout = new WidgetCheckout({
            currency: 'COP',
            amountInCents: amountInCents, 
            reference: referenceTx,
            publicKey: WOMPI_PUBLIC_KEY,
            redirectUrl: window.location.href 
        });

        // Abrir el modal seguro de pago
        checkout.open(function (result) {
            var transaction = result.transaction;
            
            if (transaction && transaction.status === 'APPROVED') {
                handleSuccessfulPayment(transaction.id, amountInCents);
            } else if (transaction && transaction.status === 'DECLINED') {
                showNotification("La transacción fue declinada por tu entidad bancaria.", "error");
            } else if (transaction && transaction.status === 'ERROR') {
                showNotification("Ocurrió un error en la pasarela de pagos.", "error");
            }
        });
    } catch (err) {
        console.error("Error detallado al abrir Wompi:", err);
        // Esto te mostrará el mensaje exacto del error en pantalla para identificarlo
        showNotification("Error Wompi: " + (err.message || err), "error");
    }
}
